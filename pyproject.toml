# pyproject.toml
#
# This file is the modern Python project definition standard (PEP 621).
# It replaces the older setup.py / setup.cfg pattern and serves as the
# single source of truth for project metadata, dependencies, and build
# configuration.
#
# Install this package in development (editable) mode with:
#     pip install -e .
#
# Install with development extras (e.g. pytest) with:
#     pip install -e .[dev]

# ----------------------------------------------------------------------------
# Build system: tells pip which library to use to build the package.
# setuptools is the standard choice for most Python projects.
# ----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ----------------------------------------------------------------------------
# Project metadata: this is what shows up on PyPI if published, and what
# tools like pip and importlib.metadata read at runtime.
# ----------------------------------------------------------------------------
[project]
name = "osint-domain-recon"
version = "0.3.1"
description = "OSINT domain reconnaissance via RDAP, DNS, email-auth, and HTTP probing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jorgy762"},
]
keywords = ["osint", "recon", "cybersecurity", "rdap", "dmarc", "dkim", "spf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Runtime dependencies: pip installs these automatically when the package
# is installed.
dependencies = [
    "whoisit>=4.0.0",
    "python-whois>=0.9.0",
    "dnspython>=2.6.0",
    "requests>=2.31.0",
]

# Optional dependency groups. Install with:  pip install -e .[dev]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

# Project URLs displayed on PyPI and in some package browsers.
[project.urls]
Homepage = "https://github.com/Jorgy762/osint-domain-recon"
Repository = "https://github.com/Jorgy762/osint-domain-recon"
Issues = "https://github.com/Jorgy762/osint-domain-recon/issues"
Changelog = "https://github.com/Jorgy762/osint-domain-recon/blob/main/CHANGELOG.md"

# Console script entry point: this registers "osint-recon" as a command
# line tool that calls into the cli.main() function. After "pip install -e ."
# you can run the tool from anywhere just by typing:  osint-recon example.com
[project.scripts]
osint-recon = "osint_recon.cli:main"

# ----------------------------------------------------------------------------
# Setuptools-specific configuration: tells the build system where the
# package source lives. Required for src-layout projects.
# ----------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------
# Pytest configuration: tells pytest where to find tests and what to call
# them. Test files match test_*.py and live under tests/.
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

# ----------------------------------------------------------------------------
# Ruff configuration: linter and code style checker.
# Run locally with:  ruff check .
# Auto-fix with:     ruff check --fix .
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Rule sets:
#   E, W: pycodestyle errors and warnings (PEP 8)
#   F:    pyflakes (undefined names, unused imports)
#   I:    isort (import ordering)
#   UP:   pyupgrade (use modern Python syntax)
#   B:    flake8-bugbear (likely bugs and anti-patterns)
#   SIM:  flake8-simplify (simplification suggestions)
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long: enforced informally, ruff is too strict here
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use star-imports of test helpers and may shadow
# builtins as part of fixture naming. Relax those rules for the tests dir.
"tests/*" = ["F401", "F811"]
# cli.py intentionally imports submodules AFTER calling _check_dependencies()
# so missing third-party libraries produce friendly error messages instead
# of raw ImportError tracebacks. E402 (module-level import not at top)
# would otherwise flag these intentional late imports.
"src/osint_recon/cli.py" = ["E402"]
